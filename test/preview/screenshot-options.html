<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Options screenshot</title>
<style>
  html, body { margin: 0; }
  body { background: #f2f4f5; }
  body.dark { background: #0e1113; }
  iframe { width: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="f" scrolling="no"></iframe>

<script>
/* Renders the real options.html + options.js + base.css against stubbed
   chrome.* APIs. The tracked-templates table is populated from the actual
   registry file, so the sources shown are the real ones. Every size, file
   version and CTAN version comes from options-snapshot.json, which
   `node test/run-planner.js --snapshot` records from a live, verified fetch of
   every registry source -- a file missing from it shows as a failure rather
   than as an invented number.
   The page reports its own height in document.title so the capture script can
   size the window exactly. */
const DARK = new URLSearchParams(location.search).get('theme') === 'dark';
if (DARK) document.body.classList.add('dark');

const MIN = 60 * 1000;

// The cache as it stands after scanning one ACM project and one IEEE project.
// Only the timestamps are illustrative.
function cacheOf(files) {
  const scanned = [
    ['ACM-Reference-Format.bst', 14 * MIN], ['IEEEtran.cls', 3 * 24 * 60 * MIN],
    ['acmart.cls', 14 * MIN], ['acmauthoryear.bbx', 14 * MIN],
    ['acmauthoryear.cbx', 14 * MIN], ['acmdatamodel.dbx', 14 * MIN],
    ['acmnumeric.bbx', 14 * MIN], ['acmnumeric.cbx', 14 * MIN],
  ].filter(([name]) => files[name]);
  const entries = scanned.map(([name, age]) => ({
    name, bytes: files[name].bytes, version: files[name].version, fetchedAt: Date.now() - age,
  }));
  return { ok: true, count: entries.length,
           totalBytes: entries.reduce((n, e) => n + e.bytes, 0), entries };
}

function stub(snap) {
  return `<script>
  const CACHE = ${JSON.stringify(cacheOf(snap.files))};
  const CTAN = ${JSON.stringify(snap.ctan)};
  const FILES = ${JSON.stringify(snap.files)};
  window.chrome = {
    runtime: {
      lastError: null,
      getURL: (p) => '../../extension/' + p,
      sendMessage: (msg, cb) => {
        if (msg.type === 'cacheStats') return cb(CACHE);
        if (msg.type === 'allowedHosts') return cb({ ok: true, hosts: [
          'api.github.com','ctan.math.illinois.edu','ctan.org','ftp.fau.de',
          'mirror.ctan.org','mirrors.ctan.org','portalparts.acm.org',
          'raw.githubusercontent.com','www.ctan.org' ] });
        if (msg.type === 'ctanPackage') {
          return cb(CTAN[msg.pkg] ? { ok: true, ...CTAN[msg.pkg] }
                                  : { ok: false, error: 'not in the snapshot' });
        }
        const name = (msg.member || msg.url || '').split('/').pop();
        if (!FILES[name]) return cb({ ok: false, error: 'not in the snapshot' });
        cb({ ok: true, text: 'x'.repeat(FILES[name].bytes),
             cached: msg.url && msg.url.includes('acm') ? 'version' : false });
      },
    },
    storage: { sync: {
      get: async () => ({ backupDefault: true, autoClose: true }),
      set: async () => {},
    }},
  };
<\/script>`;
}

const DARK_LIFT = `<script>
  addEventListener('load', () => {
    const out = [];
    for (const sheet of document.styleSheets) {
      let rules; try { rules = sheet.cssRules; } catch { continue; }
      for (const rule of rules) {
        if (rule.type === CSSRule.MEDIA_RULE &&
            /prefers-color-scheme:\\s*dark/.test(rule.conditionText)) {
          for (const inner of rule.cssRules) out.push(inner.cssText);
        }
      }
    }
    const s = document.createElement('style');
    s.textContent = out.join(String.fromCharCode(10));
    document.head.appendChild(s);
  });
<\/script>`;

(async () => {
  const html = await (await fetch('../../extension/options/options.html')).text();
  const snap = await (await fetch('options-snapshot.json')).json();
  const frame = document.getElementById('f');

  frame.srcdoc = html
    .replace('href="../styles/base.css"', 'href="../../extension/styles/base.css"')
    .replace(
      '<script src="options.js"><\/script>',
      stub(snap) + (DARK ? DARK_LIFT : '') +
      '<script src="../../extension/options/options.js"><\/script>'
    );

  frame.addEventListener('load', () => {
    const d = frame.contentDocument;
    // Run the connectivity check so the section shows real output rather than
    // an untouched button.
    setTimeout(() => d.getElementById('test').click(), 200);
    setTimeout(() => {
      frame.style.height = d.documentElement.scrollHeight + 'px';
      document.title = 'H:' + Math.ceil(d.documentElement.scrollHeight);
      document.documentElement.setAttribute('data-ready', '1');
    }, 1200);
  });
})();
</script>
</body>
</html>
